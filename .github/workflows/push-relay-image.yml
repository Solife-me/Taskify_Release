name: Publish push relay image

on:
  push:
    tags:
      - "push-relay-v*"

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "22.23.4"
  IMAGE_NAME: ghcr.io/solife-me/taskify-push-relay

jobs:
  publish:
    name: Test and publish multi-architecture image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: taskify-push-relay/package-lock.json

      - name: Tag matches the relay package version
        id: version
        working-directory: taskify-push-relay
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="push-relay-v${version}"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version (expected $expected)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install and test the relay
        working-directory: taskify-push-relay
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the relay
        uses: docker/build-push-action@v7
        with:
          context: taskify-push-relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
