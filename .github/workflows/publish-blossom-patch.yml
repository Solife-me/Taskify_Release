name: Publish Blossom PWA patch

on:
  push:
    branches: [Beta]
    paths:
      - .taskify-publish/chunk-aa

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message != 'Add Blossom storage plans integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply validated Blossom patch
        shell: bash
        run: |
          set -euo pipefail
          cat .taskify-publish/chunk-aa \
              .taskify-publish/chunk-ab \
              .taskify-publish/extra-f \
              .taskify-publish/chunk-ac \
              .taskify-publish/chunk-ad \
              .taskify-publish/chunk-ae \
              .taskify-publish/chunk-af \
              .taskify-publish/chunk-ag \
              .taskify-publish/chunk-ah \
            | base64 -d \
            | gzip -dc \
            > /tmp/blossom.patch
          git apply --index /tmp/blossom.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .taskify-publish .github/workflows/publish-blossom-patch.yml
          git commit -m "Add Blossom storage plans integration"
          git push origin HEAD:Beta
