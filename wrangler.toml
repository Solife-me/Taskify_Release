# wrangler.toml (wrangler v3.88.0^)
# The Worker that serves taskify.solife.me. `taskify` is the retired v1 Worker
# (taskify-v1.solife.me); deploying under that name would replace it, not the live site.
name = "taskify-public"
main = "worker/src/index.ts"
compatibility_date = "2026-10-12"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
preview_urls = true

[build]
command = "bash -lc 'if [ -f ../scripts/install-worker-deps.mjs ]; then node ../scripts/install-worker-deps.mjs; else node ./scripts/install-worker-deps.mjs; fi'"

[assets]
directory = "taskify-pwa/dist"
binding = "ASSETS"
# App pages are client-side routes (/boards/<id>, /upcoming, /task/<id>…): a navigation to a
# path with no file gets index.html. Worker routes are all under /api/ and are fetched, not
# navigated to, so they still reach the Worker.
not_found_handling = "single-page-application"

[triggers]
crons = ["*/1 * * * *"]

[observability.logs]
enabled = true

# A deploy replaces every variable with this section, so the push settings live here, not in the
# dashboard. Both are public: the key is also built into the PWA (VITE_VAPID_PUBLIC_KEY) and served
# at /api/config. Its private half is the VAPID_PRIVATE_KEY binding below.
[vars]
VAPID_PUBLIC_KEY = "BA5BrwPUO-j5WzaaPe28CApexdCiLMHgHrh40LoXyz_OmA21gId1yw5IxWqpIOVEnKGiXfI0FEiFDr1Kl8rj6Dw"
VAPID_SUBJECT = "mailto:dev@solife.me"

# Secrets, set with `wrangler secret put` (or `.dev.vars` for local dev):
# - CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN (Workers AI for the voice routes)

[[kv_namespaces]]
binding = "TASKIFY_DEVICES"
id = "c22ac7468ada4612b14690ecfebef904"

[[kv_namespaces]]
binding = "TASKIFY_REMINDERS"
id = "03a8da2b890b4d33b7ddc9273ada7868"

[[kv_namespaces]]
binding = "TASKIFY_PENDING"
id = "448d7dc7170c4aff81c2a58c5e07e739"

[[kv_namespaces]]
binding = "VAPID_PRIVATE_KEY"
id = "45bbad6e354443ff9b101d61a27e5dd9"

[[d1_databases]]
binding = "TASKIFY_DB"
database_name = "taskify-notifications"
database_id = "1f1f5293-4694-4319-b56b-320faa325bf1"
migrations_dir = "worker/migrations"

[[ratelimits]]
name = "PREVIEW_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "NIP05_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Per-account limit on the Watch Nostr bridge. Bridge traffic reaches public relays from shared
# Worker egress IPs, which relays rate-limit per IP; this bounds each account's share.
[[ratelimits]]
name = "WATCH_NOSTR_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 30, period = 60 }

# Per-address limit on push registration and reminder saves, which need no account.
[[ratelimits]]
name = "PUSH_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 30, period = 60 }

# Shared burst limit across both voice routes; daily budgets are atomic in D1.
[[ratelimits]]
name = "VOICE_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }
